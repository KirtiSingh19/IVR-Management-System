<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IVR List · IVR Manager</title>
    <meta name="description" content="Search, filter and manage every IVR on the system." />
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../assets/vendor/tailwind.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/ivr.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>

  <body data-page="ivr-list">
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="app-shell">
      <div data-include="sidebar"></div>

      <div class="app-content">
        <div data-include="navbar"></div>

        <main class="app-main" id="main">
          <div class="page-header">
            <div>
              <nav aria-label="Breadcrumb">
                <ol class="breadcrumb">
                  <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
                  <li class="breadcrumb-item active" aria-current="page">IVR List</li>
                </ol>
              </nav>
              <h1 class="page-header__title">IVR List</h1>
              <p class="page-header__subtitle">
                Every IVR, the extension callers reach it on, and whether it is answering.
              </p>
            </div>
            <div class="page-header__actions">
              <a class="btn btn-primary" href="create-ivr.html">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                Create IVR
              </a>
            </div>
          </div>

          <section class="card table-card" aria-labelledby="ivrTableHeading">
            <h2 class="visually-hidden" id="ivrTableHeading">IVRs</h2>

            <!-- Filters. Every control writes to the same query object, which
                 is handed to the repository as one request. -->
            <div class="toolbar">
              <div class="toolbar__search">
                <label class="visually-hidden" for="ivrSearch">Search IVRs</label>
                <i class="bi bi-search" aria-hidden="true"></i>
                <input
                  class="form-control"
                  type="search"
                  id="ivrSearch"
                  placeholder="Search name, extension or description"
                  autocomplete="off"
                />
              </div>

              <div class="toolbar__select">
                <label class="visually-hidden" for="ivrStatusFilter">Filter by status</label>
                <select class="form-select" id="ivrStatusFilter">
                  <option value="">All statuses</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>

              <div class="toolbar__select">
                <label class="visually-hidden" for="ivrExtensionFilter">Filter by extension range</label>
                <select class="form-select" id="ivrExtensionFilter">
                  <option value="">All extensions</option>
                  <!-- Ranges are derived from the data by js/ivr.js -->
                </select>
              </div>

              <button class="btn btn-outline-secondary" type="button" id="ivrClearFilters" hidden>
                <i class="bi bi-x-lg" aria-hidden="true"></i>
                Clear
              </button>

              <p class="toolbar__count" data-result-count aria-live="polite"></p>
            </div>

            <div class="table-scroll">
              <table class="table" id="ivrTable">
                <caption class="visually-hidden">
                  IVRs, with extension, description, status and creation date
                </caption>
                <thead>
                  <tr>
                    <th scope="col" aria-sort="none" data-sort-col="name">
                      <button class="th-sort" type="button" data-sort="name">
                        IVR Name <i class="bi bi-chevron-expand" aria-hidden="true"></i>
                      </button>
                    </th>
                    <th scope="col" aria-sort="none" data-sort-col="extension">
                      <button class="th-sort" type="button" data-sort="extension">
                        Extension <i class="bi bi-chevron-expand" aria-hidden="true"></i>
                      </button>
                    </th>
                    <th scope="col">Description</th>
                    <th scope="col">Menu</th>
                    <th scope="col" aria-sort="none" data-sort-col="status">
                      <button class="th-sort" type="button" data-sort="status">
                        Status <i class="bi bi-chevron-expand" aria-hidden="true"></i>
                      </button>
                    </th>
                    <th scope="col" aria-sort="descending" data-sort-col="createdAt">
                      <button class="th-sort" type="button" data-sort="createdAt">
                        Created <i class="bi bi-chevron-down" aria-hidden="true"></i>
                      </button>
                    </th>
                    <th scope="col" class="tw-text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="ivrTableBody">
                  <!-- Rendered by js/ivr.js -->
                </tbody>
              </table>
            </div>

            <div class="table-footer">
              <p class="table-footer__status tw-mb-0" data-page-status aria-live="polite"></p>
              <nav aria-label="IVR list pages">
                <ul class="pagination" id="ivrPagination"></ul>
              </nav>
            </div>
          </section>
        </main>

        <div data-include="footer"></div>
      </div>
    </div>

    <div data-include="modals"></div>

    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
